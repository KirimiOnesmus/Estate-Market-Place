databases:
  - name: estate-marketplace-db
    databaseName: estate_marketplace
    user: estate_marketplace
    plan: free
    postgresMajorVersion: "18"

services:
  - type: web
    name: estate-marketplace
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run db:generate --prefix server && npm run build --prefix client
    startCommand: cd server && npm run db:deploy && npm start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estate-marketplace-db
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          name: estate-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COMMUNICATIONS_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: estate-marketplace-db
    databaseName: estate_marketplace
    user: estate_marketplace
    plan: free
    postgresMajorVersion: "18"

services:
  - type: web
    name: estate-marketplace-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: estate-marketplace-db
          property: connectionString
      - key: COMMUNICATIONS_ENCRYPTION_KEY
        generateValue: true
